name: Offline frontend checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies without package scripts
        run: npm ci --ignore-scripts
      - name: Audit production and development dependencies
        run: npm audit --audit-level=low
      - name: Lint frontend source
        run: npm run lint
      - name: Test that enhancement cannot make provider requests
        run: npm test
      - name: Build production frontend
        run: npm run build
